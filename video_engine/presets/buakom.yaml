# 부아콤(옆집 부산아재) — 매일 올리는 숏폼 코미디 드라마
# 빠른 컷(평균 2~3초), 큰 자막, 효과 전부 켬.
# 효과 끄기: 해당 효과의 enabled: false  /  기본값 바꾸기: 같은 자리에 값 적기
name: buakom
description: 숏폼 코미디 — 빠른 컷, 큰 흰 자막 + 검은 테두리, 개그 효과 전부 켬

timing:
  insert_duration: 2.0     # 대사 없는 인서트 컷 기본 길이
  lead: 0.08               # 정지 컷: 컷 시작 → 대사 시작
  tail: 0.18               # 대사 끝 → 다음 컷
  min_cut: 1.0
  max_still_hold: 3.0      # 정지 이미지가 3초 넘게 멈춰 있지 않게
  target_avg_cut: [2.0, 3.0]

camera:
  focus: [0.5, 0.40]       # 얼굴 위치(가로, 세로 비율). 급줌이 이 점을 향해 들어감

subtitle:
  font: main               # config의 fonts.main (기본 Pretendard → Noto Sans KR → 맑은고딕)
  size: 66
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 7
  emphasis_color: "#FFE14D"   # *강조* → 노랑
  dialect_color: "#FF9A3C"    # [사투리] 와 화자 keywords → 주황
  position: bottom
  margin: 64
  max_chars: 20

# 화자별 스타일 (config.yaml / 매니페스트 speakers: 로 덮어쓸 수 있음)
speakers:
  동철:
    keywords: [아따, 뭇나, 시끄럽노, 오롬실, 와이리]    # 자동으로 주황색
  소율:
    vo: {color: "#4FB3FF"}                               # 속마음 하늘색
  엄마:
    keywords: [괴롭히나, 가시나]

# 컷 종류별 자동 효과 (still = 정지 이미지 컷 전체)
auto_effects:
  still: [kenburns]
  vo: [vo_cloud]

effects:
  kenburns:       {enabled: true, zoom: 0.10, direction: auto, ease: linear, reframe_every: 3.0, reframe_zoom: 0.08}
  punch_zoom:     {enabled: true, scale: 1.3, ramp: 0.08, shake: 0.3, shake_px: 18, sfx: punch}
  vo_cloud:       {enabled: true, vignette: 0.75, font: handwriting, color: "#4FB3FF"}
  fantasy:        {enabled: true, pink: 0.6, sparkles: 38, sfx: heartbeat}
  dialect_note:   {enabled: true}
  freeze_sticker: {enabled: true, dur: 1.3, bg: "#FFE14D"}
  orom_sil:       {enabled: true, factor: 2.5, sfx: jingle}
  assa_gaori:     {enabled: true, dur: 1.6, sfx: pop}
  wall_voice:     {enabled: true, lowpass: 850}
  brake_scratch:  {enabled: true, brake: 0.35, sfx: scratch}

transition_default: {type: cut}
transitions:
  door_wipe: {close: 0.35, hold: 0.7, open: 0.35, line_color: "#00A84D", header: "이번 역은", sfx: dingdong}
  fade: {duration: 0.3}

audio:
  target_lufs: -14
  normalize: dialogue
  bgm_lufs: -27
  true_peak: -1.5

shorts:
  size: [1080, 1920]
  loop: 0.4
  hook_hold: 1.0
  hook: {size: 80, color: "#FFFFFF", stroke: "#000000", stroke_width: 8, box: "#E8303A", y: 0.12, font: heavy}
  subtitle: {size: 74, position: lower_third, y: 0.72, max_chars: 12}
